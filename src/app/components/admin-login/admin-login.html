<div class="login-container">
  <!-- Animated background elements -->
  <div class="bg-animation">
    <div class="gradient-sphere sphere-1"></div>
    <div class="gradient-sphere sphere-2"></div>
    <div class="gradient-sphere sphere-3"></div>
    <div class="grid-overlay"></div>

    <!-- Interactive Particles -->
    <div class="particles-container">
      <div *ngFor="let p of particles()" class="particle" [style.left.%]="p.x" [style.top.%]="p.y"
        [style.width.px]="p.size" [style.height.px]="p.size" [style.animation-duration.s]="p.duration"
        [style.animation-delay.s]="p.delay">
      </div>
    </div>
  </div>

  <!-- Interactive Decorative Elements Around Login Card -->
  <div class="decorative-elements">
    <!-- Floating Orbs -->
    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>
    <div class="floating-orb orb-4"></div>

    <!-- Geometric Shapes -->
    <div class="geometric-shape shape-circle-1"></div>
    <div class="geometric-shape shape-circle-2"></div>
    <div class="geometric-shape shape-square-1"></div>
    <div class="geometric-shape shape-triangle-1"></div>

    <!-- Animated Lines -->
    <div class="animated-line line-1"></div>
    <div class="animated-line line-2"></div>
    <div class="animated-line line-3"></div>

    <!-- Glowing Dots -->
    <div class="glowing-dot dot-1"></div>
    <div class="glowing-dot dot-2"></div>
    <div class="glowing-dot dot-3"></div>
    <div class="glowing-dot dot-4"></div>
    <div class="glowing-dot dot-5"></div>
    <div class="glowing-dot dot-6"></div>
  </div>

  <!-- Main login card -->
  <div class="login-card" #loginCard>
    <!-- Logo/Brand section -->
    <div class="brand-section">
      <div class="logo-container">
        <div class="logo-pulse"></div>
        <!-- Stack of Layers Icon -->
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      </div>
      <h1 class="brand-title">Login Portal</h1>
      <p class="brand-subtitle">Welcome back! Please login to continue.</p>
    </div>

    <!-- Login form -->
    <form class="login-form" (ngSubmit)="onLogin()">
      <!-- User ID field -->
      <div class="form-group">
        <div class="input-container" [class.has-value]="userId()">
          <input id="userId" type="text" class="form-input" [ngModel]="userId()" name="userId" required
            (input)="onUserIdInput($event)" autocomplete="username">
          <label for="userId" class="form-label">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />
            </svg>
            <span>User ID</span>
          </label>
          <div class="input-highlight"></div>
        </div>
      </div>

      <!-- Password field -->
      <div class="form-group">
        <div class="input-container" [class.has-value]="password()">
          <input id="password" [type]="passwordFieldType()" class="form-input" [ngModel]="password()" name="password"
            required (input)="onPasswordInput($event)" autocomplete="current-password">
          <label for="password" class="form-label">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <span>Password</span>
          </label>
          <div class="input-highlight"></div>

          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Error message -->
      <div class="error-message" *ngIf="errorMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- Submit button -->
      <button type="submit" class="submit-button" [disabled]="isLoading()">
        <span class="button-text">Sign In</span>
        <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14m-7-7l7 7-7 7" />
        </svg>
      </button>
    </form>

    <!-- Footer links -->
    <div class="card-footer">
      <a routerLink="/" class="footer-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5m7-7l-7 7 7 7" />
        </svg>
        Back to Home
      </a>
    </div>
  </div>

  <!-- Floating Fullscreen Toggle Button -->
  <button class="floating-fullscreen-btn" [class.active]="isFullscreen()" (click)="toggleFullscreen()"
    [title]="isFullscreen() ? 'Exit Fullscreen' : 'Enter Fullscreen'">
    <!-- Expand Icon (when not fullscreen) -->
    <svg *ngIf="!isFullscreen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"></polyline>
      <polyline points="9 21 3 21 3 15"></polyline>
      <line x1="21" y1="3" x2="14" y2="10"></line>
      <line x1="3" y1="21" x2="10" y2="14"></line>
    </svg>
    <!-- Compress Icon (when fullscreen) -->
    <svg *ngIf="isFullscreen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 14 10 14 10 20"></polyline>
      <polyline points="20 10 14 10 14 4"></polyline>
      <line x1="14" y1="10" x2="21" y2="3"></line>
      <line x1="3" y1="21" x2="10" y2="14"></line>
    </svg>
  </button>
</div>

<!-- Premium loading spinner -->
<div class="spinner-overlay" *ngIf="isLoading()">
  <div class="spinner-container">
    <!-- Animated rings -->
    <div class="spinner-rings">
      <div class="ring ring-1" [class.success]="spinnerPhase() === 'success'"
        [class.error]="spinnerPhase() === 'error'"></div>
      <div class="ring ring-2" [class.success]="spinnerPhase() === 'success'"
        [class.error]="spinnerPhase() === 'error'"></div>
      <div class="ring ring-3" [class.success]="spinnerPhase() === 'success'"
        [class.error]="spinnerPhase() === 'error'"></div>

      <!-- Center content inside rings -->
      <div class="spinner-center">
        <!-- Shield icon (Always visible inside ring) -->
        <div class="spinner-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l8 4v6c0 5.5-3.5 10.5-8 12-4.5-1.5-8-6.5-8-12V6l8-4z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Status Section (Below Ring) -->
    <div class="spinner-status">
      <!-- Success/Error Icons -->
      <!-- Success/Error Icons -->
      <div class="status-icon-container" *ngIf="spinnerPhase() !== 'validating'">
        <!-- Success checkmark -->
        <svg *ngIf="spinnerPhase() === 'success'" class="status-icon success" viewBox="0 0 24 24" fill="none"
          stroke="currentColor">
          <path d="M20 6L9 17l-5-5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

        <!-- Error cross -->
        <svg *ngIf="spinnerPhase() === 'error'" class="status-icon error" viewBox="0 0 24 24" fill="none"
          stroke="currentColor">
          <circle cx="12" cy="12" r="10" stroke-width="3" />
          <line x1="15" y1="9" x2="9" y2="15" stroke-width="3" stroke-linecap="round" />
          <line x1="9" y1="9" x2="15" y2="15" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>

      <!-- Text -->
      <div class="spinner-text" *ngIf="spinnerText()" [class.success]="spinnerPhase() === 'success'"
        [class.error]="spinnerPhase() === 'error'">
        {{ spinnerText() }}
      </div>
    </div>

    <!-- Progress dots below spinner -->
    <div class="progress-dots" *ngIf="spinnerPhase() === 'validating'">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
