<div class="admin-dashboard">
  <!-- Premium Logout Overlay -->
  <div class="logout-overlay" *ngIf="isLoggingOut">
    <div class="logout-overlay-content">
      <div class="logout-icon-wrapper">
        <div class="logout-spinner-ring"></div>
        <i-lucide name="shield-check" size="48"></i-lucide>
      </div>
      <h2 class="logout-title">Securing Your Session</h2>
      <p class="logout-message">Please wait while we safely sign you out...</p>
      <div class="logout-security-badges">
        <span class="security-badge">
          <i-lucide name="lock" size="14"></i-lucide>
          Clearing Session
        </span>
        <span class="security-badge">
          <i-lucide name="shield" size="14"></i-lucide>
          Encrypting Data
        </span>
        <span class="security-badge">
          <i-lucide name="check-circle" size="14"></i-lucide>
          Secure Logout
        </span>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <i-lucide name="graduation-cap" size="28"></i-lucide>
        </div>
        <span class="logo-text" *ngIf="!sidebarCollapsed">CampusConnect</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button *ngFor="let item of menuItems" class="nav-item" [class.active]="activeSection === item.id"
        (click)="navigateTo(item.id)">
        <i-lucide [name]="item.icon" size="20"></i-lucide>
        <span *ngIf="!sidebarCollapsed">{{ item.label }}</span>
      </button>
    </nav>

    <button class="sidebar-toggle" (click)="toggleSidebar()">
      <i-lucide [name]="sidebarCollapsed ? 'chevron-right' : 'chevron-left'" size="20"></i-lucide>
    </button>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <h1 class="page-title">{{ pageTitle }}</h1>
      <div class="header-right">
        <button class="btn-icon">
          <i-lucide name="bell" size="20"></i-lucide>
          <span class="badge">5</span>
        </button>
        <div class="user-profile">
          <div class="avatar">AD</div>
          <span class="user-name">{{ admin?.username || 'Admin User' }}</span>
        </div>
        <button class="logout-btn" (click)="logout()" [disabled]="isLoggingOut">
          <i-lucide name="log-out" size="18"></i-lucide>
          <span>Logout</span>
        </button>
      </div>
    </header>

    <!-- Render child routes here -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
